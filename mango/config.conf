# Autostart
exec-once=/home/aluk/.config/mango/Autostart.sh

# Env Variables
env=XCURSOR_THEME,Layan-border-cursors
env=XCURSOR_SIZE,24
env=GTK_THEME,catppuccin-mocha-lavender-standard+default

# Monitors
monitorrule=name:eDP-1,width:1920,height:1080,refresh:60,x:0,y:0
monitorrule=name:HDMI-A-2,width:1360,height:768,refresh:60,x:1920,y:0

# Window effect
blur=0
blur_layer=1
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=6
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.15

shadows=0
layer_shadows=0
shadow_only_floating=0
shadows_size=10
shadows_blur=15
shadows_position_x=0
shadows_position_y=0
shadowscolor=0x000000aa

border_radius=28
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Animations
animations=1
layer_animations=1
animation_fade_in=1
animation_fade_out=1

# Animation Type (Available types: slide, zoom, fade, none.)
animation_type_open=zoom
animation_type_close=slide
layer_animation_type_open=slide
layer_animation_type_close=slide

# Fade Settings
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.5

# Zoom Settings
zoom_initial_ratio=0.4
zoom_end_ratio=0.6

# Durations (in milliseconds)
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=300
animation_duration_close=300
animation_duration_focus=0

# Bezier curves
animation_curve_open = 0.80,0,0.12,1.2
animation_curve_move = 0.80,0,0.12,1.4
animation_curve_tag = 0.80,0,0.12,1.4
animation_curve_close = 0.46,1.0,0.29,0.99
animation_curve_focus = 0.46,1.0,0.29,0.99
animation_curve_opafadein = 0.46,1.0,0.29,0.99
animation_curve_opafadeout = 0.5,0.5,0.5,0.5

# Tag Animation Direction (1: horizontal, 0: vertical)
tag_animation_direction = 0

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_ignore_proportion_single=0
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=0

# Dwindle Setting
dwindle_split_ratio=0.5
dwindle_smart_split=0
dwindle_hsplit=0
dwindle_vsplit=0
dwindle_preserve_split=0
dwindle_smart_resize=0
dwindle_drop_simple_split=1

# Overview Setting
hotarea_size=10
enable_hotarea=1
ov_tab_mode=0
overviewgappi=5
overviewgappo=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=us

# Trackpad
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# mouse
mouse_accel_profile=0
mouse_natural_scrolling=0

# Appearance
gappih=5
gappiv=5
gappoh=1
gappov=1
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=4
rootcolor=0x201b14ff
bordercolor=313244ff
dropcolor=0b0d14cc
focuscolor=adabe0ff
maximizescreencolor=ffffffff
urgentcolor=0xad401fff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:dwindle
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# reload config
bind=SUPER,r,reload_config

# menu,screenshot,clipboard
bind=SUPER,d,spawn,fuzzel
bind=Alt,f4,spawn,/home/aluk/.config/vibepanel/Scripts/power-menu.sh
bind=Alt,p,spawn,msnap gui
bind=SHIFT,Print,spawn_shell,msnap shot --region
bind=ALT,Print,spawn_shell,msnap cast --toggle --region
bind=CTRL,b,spawn,sh -c "cliphist list | fuzzel --dmenu | cliphist decode | wl-copy"   

# Apps
bind=SUPER,b,spawn,brave-origin-nightly --password-store=basic
bind=SUPER,t,spawn,ghostty
bind=SUPER,e,spawn,thunar
bind=SUPER,j,spawn,steam
bind=SUPER,l,spawn,ghostty -e htop
bind=SUPER,k,spawn,vesktop

# Special keys
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_SOURCE@ toggle
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set +10%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 10%-

# exit
bind=SUPER,m,quit
bind=SUPER,q,killclient,

# switch window focus
bind=SUPER,Tab,focusstack,next
bind=SUPER,a,focusdir,left
bind=SUPER,s,focusdir,right
bind=SUPER,w,focusdir,up
bind=SUPER,x,focusdir,down

# swap window
bind=SUPER+SHIFT,a,exchange_client,left
bind=SUPER+SHIFT,s,exchange_client,right
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# resize windows
bind=SUPER+SHIFT,Left,resizewin,-10,-0
bind=SUPER+SHIFT,up,resizewin,-0,-10
bind=SUPER+SHIFT,down,resizewin,-0,+10
bind=SUPER+SHIFT,Right,resizewin,+5,-0

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# switch window status
bind=SUPER,g,toggleglobal,
bind=ALT,Tab,toggleoverview,
bind=SUPER,v,togglefloating,
bind=SUPER,f,togglemaximizescreen,
bind=SUPER+SHIFT,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,

# switch layout
bind=SUPER,n,switch_layout

# tag switch
bind=SUPER,Left,viewtoleft,0
bind=CTRL,Left,viewtoleft_have_client,0
bind=SUPER,Right,viewtoright,0
bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0
bind=Alt,1,tag,1,0
bind=Alt,2,tag,2,0
bind=Alt,3,tag,3,0
bind=Alt,4,tag,4,0
bind=Alt,5,tag,5,0
bind=Alt,6,tag,6,0
bind=Alt,7,tag,7,0
bind=Alt,8,tag,8,0
bind=Alt,9,tag,9,0

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# layer rule
layerrule=animation_type_open:zoom,layer_name:fuzzel
layerrule=animation_type_close:zoom,layer_name:fuzzel
layerrule = layer_name:msnap, noanim:1, noblur:1
